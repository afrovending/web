# DigitalOcean App Platform Specification
# Deploy via: doctl apps create --spec .do/app.yaml

name: vendor-platform

region: nyc

services:
  # FastAPI Backend Service
  - name: backend
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8001
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 30
    envs:
      - key: MONGO_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DB_NAME
        scope: RUN_TIME
        value: afrovending_db
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: STRIPE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SENDGRID_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SENDER_EMAIL
        scope: RUN_TIME
        value: info@afrovending.com
      - key: PAYPAL_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: PAYPAL_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: PAYPAL_MODE
        scope: RUN_TIME
        value: sandbox
      - key: AWS_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: AWS_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AWS_REGION
        scope: RUN_TIME
        value: us-east-2
      - key: S3_BUCKET_NAME
        scope: RUN_TIME
        value: afrovending-uploads
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: "*"

  # React Frontend Service
  - name: frontend
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: yarn install && yarn build
    environment_slug: node-js
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: REACT_APP_BACKEND_URL
        scope: BUILD_TIME
        value: ${APP_URL}

databases:
  - name: db
    engine: MONGODB
    production: false
    cluster_name: vendor-platform-db
    db_name: afrovending_db
